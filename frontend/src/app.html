<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Anti-parpadeo de tema: aplica la clase antes del primer pintado (portado del
      // `base.html` del proyecto anterior). En SPA no hay SSR que fije `<html lang>`; eso
      // lo hace `+layout.svelte` al montar.
      (() => {
        try {
          const stored = localStorage.getItem("theyrethink-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const dark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          // Sin localStorage (modo privado): se queda en el tema claro.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
