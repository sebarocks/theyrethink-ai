name: CI

# Las actions se fijan a versión completa, no al *major* móvil.
# Ojo: `astral-sh/setup-uv` y `denoland/setup-deno` NO publican tags móviles de major
# (`@v10` / `@v2` no existen): solo versiones completas. Un `@v10` falla al resolver la
# action antes incluso de arrancar el job.

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (uv, ruff, import-linter, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: theyrethink
          POSTGRES_PASSWORD: theyrethink
          POSTGRES_DB: theyrethink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theyrethink -d theyrethink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10 
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://theyrethink:theyrethink@localhost:5432/theyrethink
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sincronizar el entorno
        run: uv sync --locked

      - name: Formato
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Contratos de import
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

  # Job de frontend (Fase 4). Regla del proyecto (AGENTS.md §2): NUNCA
  # `actions/setup-node`; el frontend usa Deno.
  frontend:
    name: Frontend (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instalar Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - name: Cache de Deno
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('frontend/deno.lock') }}

      - name: Instalar dependencias (lockfile congelado)
        run: deno install --frozen

      - name: Formato
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Sincronizar SvelteKit
        run: deno task sync

      - name: Typecheck
        run: deno task check

      - name: Tests (Deno)
        run: deno task test

      - name: Tests (Vitest)
        run: deno task test:unit

      - name: Build
        run: deno task build

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}

      - name: Instalar Chromium (Playwright)
        run: deno run -A npm:playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: deno task test:e2e